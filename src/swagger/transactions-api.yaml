openapi: 3.0.3
info:
  title: Argent Bank - Transactions API
  description: API documentation for Argent Bank transactions service.
  version: 1.0.0
servers:
  - url: http://localhost:3001/api/v1
    description: Development server

paths:
  # Route 1 : Récupérer toutes les transactions d'un compte
  /bank/accounts/{accountId}/transactions:
    get:
      summary: Get transactions by account ID
      description: Retrieve a list of transactions associated with a specific bank account.
      security:
        - BearerAuth: []
      parameters:
        - name: accountId
          in: path
          required: true
          description: ID of the bank account
          schema:
            type: string
      responses:
        '200':
          description: Successful retrieval of transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Transaction'
        '401':
          description: Unauthorized
        '404':
          description: Account not found

  # Route 2 : Récupérer les détails d'une transaction spécifique
  /bank/transactions/{transactionId}:
    get:
      summary: Get transaction details by ID
      description: Retrieve detailed information for a specific transaction.
      security:
        - BearerAuth: []
      parameters:
        - name: transactionId
          in: path
          required: true
          description: ID of the transaction
          schema:
            type: string
      responses:
        '200':
          description: Successful retrieval of transaction details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '401':
          description: Unauthorized
        '404':
          description: Transaction not found

    # Route 3 : Modifier les informations d'une transaction (ex: catégorie ou notes)
    put:
      summary: Update transaction details
      description: Update category or notes for a specific transaction.
      security:
        - BearerAuth: []
      parameters:
        - name: transactionId
          in: path
          required: true
          description: ID of the transaction to update
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                category:
                  type: string
                  example: "Food"
                notes:
                  type: string
                  example: "Dinner with friends"
      responses:
        '200':
          description: Transaction successfully updated
        '401':
          description: Unauthorized
        '404':
          description: Transaction not found

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Transaction:
      type: object
      properties:
        id:
          type: string
          example: "t12345"
        date:
          type: string
          format: date
          example: "2027-06-20"
        description:
          type: string
          example: "Golden Sun Bakery"
        amount:
          type: number
          example: 12.50
        balance:
          type: number
          example: 2082.79
        type:
          type: string
          example: "Electronic"
        category:
          type: string
          example: "Food"
        notes:
          type: string
          example: "test"